<div class="container-fluid vh-100">
    <div class="row h-100">
      <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-center align-items-center left-section text-center p-5">
        <div class="illustration-wrapper mb-4">
          <img src="assets/signup-hero.png" alt="Students learning" class="img-fluid rounded shadow">
        </div>
        <h2 class="fw-bold text-white mt-4">
          Start Your Learning Journey
        </h2>
  
        <p class="text-white-50 mt-3 w-75">
          Join thousands of students exploring courses, growing skills,
          and achieving their dreams.
        </p>
      </div>

      <div class="col-lg-6 d-flex align-items-center justify-content-center bg-light">
        <div class="w-75">
          <div class="mb-4 d-flex align-items-center gap-2">
            <div class="logo-icon">
              🎓
            </div>
            <h5><span class="gradient-text"><strong>Shana LifeSkills Center</strong></span> </h5>
          </div>
  
          <h3 class="fw-bold">Create Account</h3>
          <p class="text-muted mb-4">
            Begin your adventure in learning today!
          </p>
          <div class="row">
            <div class="mb-4 text-center">
              <div class="position-relative d-inline-block">
                <input type="file" id="profileUpload" class="d-none" (change)="onFileSelected($event)" accept="image/*" />
                <label for="profileUpload" style="cursor: pointer;" title="Click to change image">
                <img [src]="imagePreview || 'assets/default-user.png'" class="rounded-circle border shadow-sm"
                  style="width: 80px; height: 80px; object-fit: cover; display: block; margin: 0 auto;" alt="Profile Image" />
                </label>
              </div>
              <div class="text-muted mt-1" style="font-size: 12px;">
                Click the image to upload
              </div>
            </div>
          </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input [(ngModel)]="user.firstName" name="firstName" type="text" class="form-control" placeholder="John">
              </div>
              
              <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input [(ngModel)]="user.lastName" name="lastName" type="text" class="form-control" placeholder="Doe">
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input [(ngModel)]="user.email" name="email" type="email" class="form-control" placeholder="you@example.com">
              </div>
              
              <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="position-relative">
                  <input [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="user.password" name="password" class="form-control"
                    placeholder="Create a strong password" style="padding-right: 45px;"> <button type="button"
                    class="toggle-password-btn" (click)="togglePasswordVisibility()" title="Toggle Password Visibility">
                    <i class="fa" [ngClass]="hidePassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                  </button>
                </div>
              </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="terms">
              <label class="form-check-label text-muted" for="terms">
                I agree to the
                <a href="#" class="text-primary">Terms of Service</a>
                and
                <a href="#" class="text-primary">Privacy Policy</a>
              </label>
            </div>

            <button [disabled]="saving" type="submit" (click)="register()" class="btn btn-primary w-100 py-2 fw-semibold">
              <i *ngIf="saving" class="fa fa-spinner fa-spin me-2"></i>
                📖 Create Account
            </button>

            <div class="text-center mt-4">
              <span class="text-muted">Already have an account?</span>
              <a routerLink="/login" class="text-primary fw-semibold">Sign in</a>
            </div>
        </div>
      </div>
    </div>
  </div>
