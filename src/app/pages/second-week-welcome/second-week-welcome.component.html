<div class="strengths-wrapper">
    <!-- Welcome Block -->
    <section class="welcome">
        <div class="welcome-content">
          <div class="text">
            <h4>🌟 Week 2 Practice</h4>
            <h2>My Strengths <small> Make Me Shine!</small></h2>
            <p>
              Welcome, amazing learner! Today we're going on a special adventure to discover all the wonderful things that make <strong>YOU</strong> special. Let's find your strengths together!
            </p>
            <button (click)="startDiscovery()">🤍 Start Discovering!</button>
          </div>
      
          <div class="image">
            <img src="assets/hero-strengths.jpg" alt="Teacher with kids" />
          </div>
        </div>
      </section>
      
  
    <!-- Teacher Message -->
    <section class="teacher-message" *ngIf="discoveryStarted">
      <h3>👩‍🏫 Trainer’s Message</h3>
      <p>Every strength makes you special! ✨</p>
      <button routerLink="/second-week-level2" class="begin-lessons-btn">Begin Lessons 🚀</button>
    </section> 
  </div>
