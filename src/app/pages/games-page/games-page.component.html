<div class="game-hub-container">
    <!-- Header Section -->
    <div class="header">
      <div class="header-content">
        <h1 class="title">Games Hub</h1>
        <p class="subtitle">
          Fun and safe games for learners to play, learn, and explore!
        </p>
        <div class="rainbow-line"></div>
      </div>
    </div>
  
    <!-- Game Cards Grid -->
    <div class="game-grid">
      <a
        class="game-card"
        *ngFor="let game of games"
        [href]="game.link"
        target="_blank"
        rel="noopener noreferrer">
        <div class="game-card-content">
          <h3>{{ game.name }}</h3>
        </div>
      </a>
    </div>
  </div>
