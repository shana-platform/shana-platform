<div class="kindness-wrapper text-center">

    <!-- Header Section -->
    <div class="header-area">
      <div class="heart-badge">💙</div>
  
      <h1 class="title">Kindness Corner</h1>
      <p class="subtitle">Spread joy, one kind word at a time</p>
    </div>
  
    <!-- Challenge Card -->
    <div class="challenge-card mx-auto">
      <div class="badge-pill mb-3">
        ⭐ Challenge of the Week ⭐
      </div>
  
      <h2 class="challenge-text">
        Say something <span class="blue">kind</span> to someone who is
        <span class="orange">different</span> from you.
      </h2>
  
      <div class="emoji-row mt-3">
        <span>🧡</span>
        <span>✨</span>
        <span>💚</span>
      </div>
    </div>
  
    <!-- Confidence Line -->
    <div class="confidence-card mx-auto mt-4">
      <div class="confidence-icon">❝❞</div>
      <div class="confidence-content">
        <small class="label">CONFIDENCE LINE</small>
        <p class="mb-0">
          "Respect means <span>everyone</span> belongs."
        </p>
      </div>
    </div>

    <button
    class="btn btn-info complete-btn mt-4"
    (click)="completeLesson()">
    Complete Lesson ✅
  </button>
  </div>
  

    <!-- Modal -->
    <div class="modal-backdrop" *ngIf="showModal">
        <div class="modal-card">
      
          <div class="modal-emoji">🎉</div>
      
          <h2>Good Job!</h2>
          <p>You did an amazing job.<br>Proceed to the next lesson!</p>
      
          <button class="next-btn" routerLink="/respect-module">
            Back To Dashboard ➡️
          </button>
      
        </div>
      </div>
