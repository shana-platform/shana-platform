<div class="hero-page">
    <!-- Header -->
    <div class="hero-header">
      <h1>⭐ <span class="title">My Hero Me!</span> ♡</h1>
      <p class="subtitle">
        Create a character that shows the world who YOU are! Pick clothes, colors,
        and accessories that make you feel amazing! ✨
      </p>
      <div class="header-tags">
        <span>✨ Express Yourself</span>
        <span>♡ Show What Makes You Special</span>
        <span>⭐ Be Your Best Self</span>
      </div>
    </div>
  
    <!-- Main Game Layout -->
    <div class="hero-container">
      <!-- Left: Character Preview -->
      <div class="hero-preview">
        <div class="hero-card">
          <img src="assets/dressup.jpg" alt="Your Hero" class="hero-image" />
          <div class="hero-footer">
            <h3>Your Hero!</h3>
            <div class="hero-tags">
              <span class="tag casual">casual</span>
              <span class="tag disabled">glasses</span>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Right: Options -->
      <div class="hero-options">
        <!-- Choose Style -->
        <div class="option-card">
          <h3>👕 Choose Your Style</h3>
          <div class="style-grid">
            <button class="style-btn active">👕 Casual Hero</button>
            <button class="style-btn">🦸 Super Hero</button>
            <button class="style-btn">🤓 Smart Hero</button>
            <button class="style-btn">🎨 Creative Hero</button>
            <button class="style-btn">🧭 Adventure Hero</button>
            <button class="style-btn">🤝 Helping Hero</button>
          </div>
        </div>
  
        <!-- Pick Colors -->
        <div class="option-card">
          <h3>🎨 Pick Your Colors</h3>
          <div class="color-palette">
            <div class="color-swatch red"></div>
            <div class="color-swatch blue"></div>
            <div class="color-swatch green"></div>
            <div class="color-swatch yellow"></div>
            <div class="color-swatch purple"></div>
            <div class="color-swatch orange"></div>
          </div>
        </div>
  
        <!-- Add Some Magic -->
        <div class="option-card">
          <h3>✨ Add Some Magic</h3>
          <div class="magic-grid">
            <button class="magic-btn">✨ No Accessory</button>
            <button class="magic-btn">👑 Crown</button>
            <button class="magic-btn active">🤓 Smart Glasses</button>
            <button class="magic-btn">🎩 Cool Hat</button>
            <button class="magic-btn">🦸‍♀️ Hero Cape</button>
            <button class="magic-btn">🎖️ Helper Badge</button>
          </div>
        </div>
  
        <!-- Action Buttons -->
        <div class="action-buttons">
          <button class="save-btn">🎉 Save My Hero!</button>
          <button routerLink="/third-week-level6" class="restart-btn">Proceed to Lesson 6</button>
        </div>
      </div>
    </div>
  </div>
