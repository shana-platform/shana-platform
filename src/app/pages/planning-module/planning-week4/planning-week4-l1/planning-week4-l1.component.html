<div class="container py-5 plan-relay-page">

  <!-- Header -->
  <div class="text-center mb-4">
    <span class="warmup-badge">✨ Warm-Up Game</span>
    <h1 class="page-title mt-3">Plan Relay</h1>
    <p class="page-subtitle">
      Drag the steps into the right order to make a good plan!
    </p>
  </div>

  <!-- Steps to Arrange -->
  <div class="steps-wrapper mb-5">
    <h6 class="section-title">STEPS TO ARRANGE</h6>

    <div
      cdkDropList
      [cdkDropListData]="steps"
      (cdkDropListDropped)="drop($event)"
      class="steps-container">

      <div
        class="step-card"
        *ngFor="let step of steps"
        cdkDrag>
        <span class="drag-icon">⋮⋮</span>
        {{ step }}
      </div>
    </div>
  </div>

  <!-- Your Order -->
  <div class="order-wrapper mb-4">
    <h6 class="section-title">YOUR ORDER</h6>

    <div
      class="order-slot"
      *ngFor="let slot of orderSlots; let i = index"
      cdkDropList
      [cdkDropListData]="orderSlots"
      (cdkDropListDropped)="drop($event)">

      <span class="order-number">{{ i + 1 }}</span>

      <div class="slot-content">
        <span *ngIf="!orderSlots[i]" class="order-placeholder">
          Drop a step here
        </span>
        <span *ngIf="orderSlots[i]" class="dropped-step">
          {{ orderSlots[i] }}
        </span>
      </div>
    </div>
  </div>

  <!-- Feedback -->
  <div *ngIf="showResult" class="feedback-card" [class.success]="isCorrect" [class.error]="!isCorrect">
    <div *ngIf="isCorrect">
      🎉 Great job! You planned it perfectly!
    </div>
    <div *ngIf="!isCorrect">
      😊 Nice try! Planning takes practice — give it another go.
    </div>
  </div>

  <!-- Actions -->
  <div class="d-flex justify-content-center gap-3 mt-4">
    <button class="btn btn-primary check-btn" (click)="checkAnswer()">
      ✅ Check Answer
    </button>

    <button class="btn btn-outline-secondary try-btn" (click)="tryAgain()">
      🔄 Try Again
    </button>
  </div>

</div>
