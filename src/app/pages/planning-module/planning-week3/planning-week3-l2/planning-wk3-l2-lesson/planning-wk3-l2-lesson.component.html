<div class="smart-info-page-wrapper py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10 text-center">
  
          <p class="page-tag text-muted small mb-1">{{ pageTag }}</p>
          <h1 class="page-title fw-bold mb-3">What Are <span class="text-primary-blue">SMART</span> Goals?</h1>
          <p class="page-subtitle text-muted mb-5">{{ pageSubtitle }}</p>
          
          <div class="row smart-cards-grid">
            <div 
              *ngFor="let element of smartElements" 
              class="col-md-6 col-lg-4 mb-4"
            >
              <div [class]="'smart-card card border-0 rounded-4 p-4 shadow-sm ' + element.colorClass">
                <div class="card-content text-start">
                  
                  <div class="d-flex justify-content-between align-items-start mb-3">
                    <span class="smart-letter fw-bold">{{ element.letter }}</span>
                    <div class="smart-icon-box">
                      <i class="fa" [class]="element.icon"></i>
                    </div>
                  </div>
                  
                  <h5 class="smart-title fw-bold mb-2">{{ element.title }}</h5>
                  <p class="smart-description mb-3">{{ element.description }}</p>
                  
                  <div class="smart-example-box p-3 rounded-3">
                    <p class="small text-muted mb-0">Example:</p>
                    <p class="fw-medium mb-0">{{ element.example }}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
  
        </div>
      </div>
    </div>
  </div>
