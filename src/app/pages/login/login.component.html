<div class="full-login-page">
    <div class="left-pane">
      <div class="login-box">
        <form [formGroup]="loginForm" (ngSubmit)="login()">
           <h5>✨ <span class="gradient-text">Welcome To <strong>Shana LifeSkills Center</strong></span> ✨</h5>
           <br>
          <label>Email Address</label>
          <div class="input-group">
            <input type="email" formControlName="email" placeholder="student@shana.edu" />
          </div>
            <br>
          <label>Password</label>
          <div class="input-group">
            <input type="password" formControlName="password" placeholder="Enter your password" />
          </div>
  
          <div class="options">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
  
          <!-- <button routerLink="/dashboard" type="submit" class="btn-primary">
            💬 Sign In to Dashboard
          </button> -->
          <button (click)="login()" type="submit" class="btn-primary">
            💬 Sign In to Dashboard
          </button>
  
          <div class="footer-text">
            New student? <a routerLink="/sign-up">Create an account</a>
          </div>
        </form>
  
        <footer>© {{currentYear}} ShanaPortal. All rights reserved.</footer>
      </div>
    </div>
  
    <!-- Right pane: Hero image or branding -->
    <div class="right-pane">
      <img style="height: 597px; width: 800px;" src="assets/hero-strengths.jpg" alt="Learning Illustration" />
    </div>
  </div>
