<div class="full-login-page">
    <!-- Left pane: Login form -->
    <div class="left-pane">
      <div class="login-box">
        <!-- <div class="header text-center">
          <img style="height: 160px; width: 160px;" src="assets/shana.png" alt="shana Logo" class="logo" />
          <h1><span class="brand">Shana</span> Life Skills</h1>
          <p class="subtitle">Your gateway to learning excellence</p>
        </div> -->
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <h2><span class="icon">🎓</span> Welcome Back</h2>
          <p class="form-subtitle">Sign in to your student account to continue learning</p>
          <br>
          <label>Email Address</label>
          <div class="input-group">
            <span class="icon">📧</span>
            <input type="email" formControlName="email" placeholder="student@shana.edu" />
          </div>
            <br>
          <label>Password</label>
          <div class="input-group">
            <span class="icon">🔒</span>
            <input type="password" formControlName="password" placeholder="Enter your password" />
          </div>
  
          <div class="options">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>
  
          <button type="submit" class="btn-primary">
            💬 Sign In to Dashboard
          </button>
  
          <div class="footer-text">
            New student? <a href="#">Create an account</a>
          </div>
        </form>
  
        <footer>© 2025 ShanaPortal. All rights reserved.</footer>
      </div>
    </div>
  
    <!-- Right pane: Hero image or branding -->
    <div class="right-pane">
      <img style="height: 700px; width: 700px;" src="assets/learn.png" alt="Learning Illustration" />
    </div>
  </div>
