<div class="row" style="min-height: 100vh;margin:0;padding: 0;">
    <div class="col-sm-4 col-md-8 col-lg-8 p-0">
      <img src="assets/passwordresetimage.jpg" alt=""  class="img-fluid pb-0 mb-0">
    </div>
    <div class="col-sm-8 col-md-4 col-lg-4 border-start d-flex flex-column justify-content-between align-items-center ">
     <div class="d-flex justify-content-center  mb-2">
       <img src="assets/shana.png" alt="" height="300px" >
     </div>
      <div class="container ">
          <div class=" border-0 ">
               <div class="row">
                <div class="col-8 mx-auto">
                   <h4 class="fw-normal">Forgot Password?</h4>
                    <p class="fw-light fs-6"> <small>
                      Enter your email and we will send you a link with instruction to reset your passowrd.
                    </small>
                    </p>
                </div>
               </div>


                <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                  <div class="row mt-5">
                    <div class="col-8 mb-2 mx-auto">

                    <label for="email" class="form-label  mb-1 text-xs text-muted"> <small>Email </small> </label>
                    <input
                      type="email"
                      formControlName="email"
                      class="form-control form-control-sm"
                      placeholder="johndoe@gmail.com"
                      [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
                    />
                    <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
                      <div *ngIf="f['email'].errors['required']"><small> Email is required </small></div>
                      <div *ngIf="f['email'].errors['email']">Enter a valid email</div>
                    </div>
                  </div>
                  <div class="col-8 mx-auto my-3">
                    <button type="submit" class="btn btn-warning py-2 text-white w-100" style="font-size: smaller;">Send Reset Link</button>

                    <a class="btn btn-sm mt-3 w-100   rounded-1 border-0" style="font-size: smaller;" routerLink="/login">
                      <i class="fa fa-angle-left"></i>
                      Back to Login
                    </a>
                  </div>
                </div>

                </form>

          </div>

      </div>

      <footer class="mb-0">
          <small class="text-muted text-center">
            <p>© 2025 &nbsp; <strong class="me-2">ShanaLifeSkills.</strong> All rights reserved.</p>
          </small>
      </footer>
    </div>
</div>
