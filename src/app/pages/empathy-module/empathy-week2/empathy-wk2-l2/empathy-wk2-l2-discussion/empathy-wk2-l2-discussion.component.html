<div class="discussion-container mb-5">
    <h2 class="section-title">Independent Discussion Prompts
      <p class="text-muted fs-6 fw-light">Type your answers in the text boxes provided.</p>
    </h2>
    
    <div *ngFor="let prompt of discussionPrompts" class="discussion-card">
      <h4 class="question">{{ prompt.question }}</h4>
  
      <!-- User Input Section -->
      <div class="user-answer">
        <textarea
          [(ngModel)]="prompt.userAnswer"
          [disabled]="prompt.submitted"
          placeholder="Type your response here..."
          class="answer-box"></textarea>
        <button
          *ngIf="!prompt.submitted"
          (click)="submitAnswer(prompt)"
          class="submit-btn">
          Submit
        </button>
        <div *ngIf="prompt.submitted" class="submitted-answer">
          <strong>Your answer: <span class="text-primary">{{ prompt.userAnswer }}</span></strong>
        </div>
      <ng-container *ngIf="prompt.submitted">
        <div class="thanks-message mt-2 text-primary small">
            {{ prompt.feedback }}
        </div>
      </ng-container>
      </div>

 
  
   
  
      <!-- Others' Answers -->
      <div *ngIf="prompt.submitted" class="others-section">
        <h5 class="others-title">Sample Answers:</h5>
  
        <div *ngFor="let answer of prompt.others" class="other-answer">
          <!-- When it's a named comment -->
          <ng-container *ngIf="answer.name; else textAnswer">
            <span class="comment">{{ answer.comment }}</span>
          </ng-container>
  
          <!-- When it's a plain text answer -->
          <ng-template #textAnswer>
            <span class="comment">{{ answer.text }}</span>
          </ng-template>
        </div>
      </div>
    </div>


      <div class="text-center">
        <button class="submit-btn" (click)="submitImage()">
            Complete Lesson ✅
          </button>
      </div>
  </div>
   <!-- MODAL -->
<div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-card">
  
      <div class="modal-emoji">🎉</div>
  
      <h2>Good Job!</h2>
      <p>You did an amazing job.<br>Proceed to the next lesson!</p>
  
      <button class="next-btn" routerLink="/empathy-week2-l3" (click)="closeModal()">
        Continue ➡️
      </button>
  
    </div>
  </div>
