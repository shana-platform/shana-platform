<div class="try-page text-center">
    <!-- Header -->
    <div class="header-section">
      <div class="icon-badge mb-2">
        <i class="fa-regular fa-face-smile"></i>
      </div>
      <h1 class="page-title">Would You Try It?</h1>
      <p class="subtitle">
        A fun warm-up game to explore what makes us willing to try new things!
      </p>
    </div>
  
    <!-- Timer + Progress -->
    <div class="status-bar d-flex justify-content-center align-items-center mt-3">
      <div class="timer d-flex align-items-center justify-content-center">
        <i class="fa-regular fa-clock me-2"></i>
        <span>{{ formatTime(timeElapsed) }}</span>
      </div>
    </div>
  
    <div class="progress-info mt-2 mb-4">
      <small>Scenario {{ scenarioLabel }}</small>
      <div class="progress mt-1" style="height: 8px; border-radius: 6px;">
        <div
          class="progress-bar"
          role="progressbar"
          [style.width.%]="progressPercentage"
          style="background-color: #3b82f6;"
        ></div>
      </div>
    </div>
  
    <!-- Question Card -->
    <div class="question-card mx-auto p-4">
      <div class="emoji mb-3">{{ currentQuestion.emoji }}</div>
      <h4 class="fw-bold mb-4">
        {{ currentQuestion.text }}
      </h4>
  
      <!-- <div class="answers row justify-content-center">
        <div
          class="col-8 col-md-3 mb-3"
          *ngFor="let option of currentQuestion.options"
        >
          <button class="answer-btn w-100" (click)="onAnswerSelect(option)">
            {{ option.emoji }} <br />
            <span>{{ option.label }}</span>
          </button>
        </div>
      </div> -->
      <div class="answers row justify-content-center">
        <div
          class="col-8 col-md-3 mb-3"
          *ngFor="let option of currentQuestion.options; let i = index"
        >
          <button
            class="answer-btn w-100"
            [ngClass]="{ selected: selectedOptionIndex === i }"
            (click)="onAnswerSelect(option, i)"
          >
            {{ option.emoji }} <br />
            <span>{{ option.label }}</span>
          </button>
        </div>
      </div>
      

    </div>
  
    <!-- Navigation -->
    <div class="navigation mt-4 d-flex justify-content-between align-items-center mx-auto">
      <button
        class="nav-btn btn btn-light shadow-sm"
        [disabled]="currentQuestionIndex === 0"
        (click)="previousQuestion()"
      >
        <i class="fa-solid fa-arrow-left me-2"></i>Previous
      </button>
  
      <button
        class="nav-btn btn btn-primary shadow-sm"
        (click)="nextQuestion()"
      >
        {{ nextButtonLabel }} <i class="fa-solid fa-arrow-right ms-2"></i>
      </button>
    </div>
  </div>
