<div class="story-container">
  <h1 class="story-title">
    <span class="highlight-green me-3">Anne's</span>

    <span class="highlight-blue">Adventure</span>
  </h1>
  <p class="story-subtitle"></p>

  <!-- Carousel -->
  <div class="carousel">
    <button class="nav-btn left" (click)="prevSlide()">&#8249;</button>

    <div class="slide">
      <div class="slide-image">
        <img [src]="slides[currentIndex].image" [alt]="">
      </div>
    </div>

    <button class="nav-btn right" (click)="nextSlide()">&#8250;</button>
  </div>

  <!-- Indicators -->
  <div class="indicators">
    <span 
      *ngFor="let slide of slides; let i = index" 
      class="dot" 
      [class.active]="i === currentIndex"
      (click)="goToSlide(i)">
    </span>
  </div>

  <!-- Footer Controls -->
  <div class="footer-controls">
    <span class="page-count">{{ currentIndex + 1 }} of {{ slides.length }}</span>
    <button class="autoplay-btn" (click)="toggleAutoplay()">
      {{ autoplay ? '⏸ Pause' : '▶ Auto Play' }}
    </button>
    <!-- <button class="cta-button" routerLink="/third-week-level3">
      🚀  Next Lesson
    </button> -->
  </div>
</div>
